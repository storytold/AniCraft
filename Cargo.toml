[workspace]
resolver = "3"
members = [".", "crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
# 0.1.0 is the early alpha (release stage in src/app.rs, RELEASE_STAGE); see CHANGELOG.md
# and docs/release.md.
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# An application, not a library: not published to crates.io.
publish = false
repository = "https://github.com/storytold/AniCraft"
rust-version = "1.95"

[workspace.dependencies]
anicraft-geom = { path = "crates/geom" }
anicraft-doc = { path = "crates/doc" }
anicraft-render = { path = "crates/render" }
anicraft-engine = { path = "crates/engine" }
anicraft-xfl = { path = "crates/xfl" }
anicraft-xml = { path = "crates/xml" }
anicraft-svg = { path = "crates/svg" }
anicraft-text = { path = "crates/text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
png = "0.17"
# JPEG decoding for imported images (already in the tree; MIT OR Apache-2.0 OR Zlib).
zune-jpeg = { version = "0.5", default-features = false }
gif = "0.14"
# wgpu is the primary renderer; glow (OpenGL) is the fallback for GPUs/VMs where wgpu fails.
# Default features off: we skip `links` (opening web links pulls in url/idna/ICU Unicode
# tables we don't use) and the web-only screen-reader shim. Same set as PhotoCraft, plus glow.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow", "wayland", "x11"] }
# Native file dialogs: Windows common dialogs, macOS NSOpenPanel, Linux XDG desktop portal.
rfd = "0.17"
# Lists and loads the OS's installed fonts for Preferences › Appearance (MIT).
# Without the `fontconfig` feature, Linux scans the standard font folders directly
# (/usr/share/fonts, /usr/local/share/fonts, ~/.local/share/fonts, ~/.fonts).
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }
egui = "0.37"
# Interface translations (ADR 0014): lookup, fallback, CLDR plurals, language names and the system
# locale over the craft-i18n catalogs that build.rs embeds from CRAFT_I18N_DIR. The Crafting Apps'
# shared crate (craft-libs, MIT OR Apache-2.0), at an immutable revision allowed in deny.toml.
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "fd5e2feff6ea25bed371a99cc732b3968d621505" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[package]
name = "anicraft"
description = "AniCraft desktop app: egui shell over the AniCraft engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
default-run = "anicraft"

[[bin]]
name = "anicraft"
path = "src/main.rs"

[dependencies]
anicraft-geom.workspace = true
anicraft-doc.workspace = true
anicraft-render.workspace = true
anicraft-engine.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
serde.workspace = true
fontdb.workspace = true
serde_json.workspace = true
craft-i18n.workspace = true

[lints]
workspace = true

# ----- build profiles: biased for disk space, then time (docs/development.md › Build footprint) --

[profile.dev]
opt-level = 1
# File:line in backtraces and panics, without full variable debug info (a fraction of the size;
# also keeps Windows PDBs under the LNK1140 limit).
debug = "line-tables-only"
# The incremental cache was ~3 GB for our crates; they rebuild from scratch in seconds.
incremental = false

[profile.dev.package."*"]
# Dependencies: optimized once (fast app in debug builds), no debug info at all.
opt-level = 2
debug = false

[profile.dev.build-override]
# Build scripts and proc-macros: compile fast, no debug info.
opt-level = 0
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The egui family on storytold's fork, as the other Crafting Apps use it (ADR 0014): it lays out
# right-to-left text in its right order (Unicode bidi; crates.io egui shapes each Arabic word but
# places the words left to right) and mirrors egui's own parts with `Style::right_to_left`.
# Immutable revisions, allowed in deny.toml.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
