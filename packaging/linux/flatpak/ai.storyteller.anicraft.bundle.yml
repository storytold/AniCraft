# Flatpak manifest for the single-file bundle attached to every GitHub release
# (anicraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (anicraft-<version>-linux-<arch>.tar.gz, built on
# Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no network and no
# vendored crate sources during the build, a few seconds instead of many minutes, and the same
# binaries as the AppImage/deb/rpm. The script unpacks the tarball into `stage/` next to a copy of
# this file. The binaries need glibc >= 2.35, ALSA, and load X11, Wayland, xkbcommon and Vulkan at
# runtime; the freedesktop runtime has all of them, and the GPU driver comes from its
# org.freedesktop.Platform.GL extension.
#
# ai.storyteller.anicraft.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: ai.storyteller.anicraft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: anicraft
finish-args:
  # Honor the launcher's pinned and nightly version choices before offering updates.
  - --filesystem=xdg-data/ArtCraft/versions:ro
  # Release checks and downloads use HTTPS.
  - --share=network
  # Verified update helpers run through flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for wgpu (Vulkan, or GL as a fallback).
  - --device=dri
  # Sound during playback (cpal over ALSA, which the runtime routes to PulseAudio or PipeWire).
  - --socket=pulseaudio
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents, Pictures and Videos are granted so files passed by path (the
  # command line, Open Recent, exports next to the document) work in the usual places.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
modules:
  - name: anicraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/anicraft /app/bin/anicraft
      - install -Dm755 bin/anicraft-cli /app/bin/anicraft-cli
      - install -Dm644 share/applications/ai.storyteller.anicraft.desktop /app/share/applications/ai.storyteller.anicraft.desktop
      - install -Dm644 share/mime/packages/ai.storyteller.anicraft.xml /app/share/mime/packages/ai.storyteller.anicraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.anicraft.metainfo.xml /app/share/metainfo/ai.storyteller.anicraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/anicraft /app/share/doc/
    sources:
      - type: dir
        path: stage
