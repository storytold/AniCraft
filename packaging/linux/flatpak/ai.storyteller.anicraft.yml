# Flatpak manifest for AniCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/ai.storyteller.anicraft.yml
#   flatpak run ai.storyteller.anicraft
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The single-file .flatpak attached to each release comes from ai.storyteller.anicraft.bundle.yml,
# which repackages the prebuilt release binaries. Keep runtime, runtime-version, sdk and
# finish-args identical in both (packaging-lint checks this).
id: ai.storyteller.anicraft
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: anicraft
finish-args:
  # Honor the launcher's pinned and nightly version choices before offering updates.
  - --filesystem=xdg-data/ArtCraft/versions:ro
  # Release checks and downloads use HTTPS.
  - --share=network
  # Verified update helpers run through flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for wgpu (Vulkan, or GL as a fallback).
  - --device=dri
  # Sound during playback (cpal over ALSA, which the runtime routes to PulseAudio or PipeWire).
  - --socket=pulseaudio
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents, Pictures and Videos are granted so files passed by path (the
  # command line, Open Recent, exports next to the document) work in the usual places.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-videos
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: anicraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/anicraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p anicraft -p anicraft-cli
      - install -Dm755 target/release/anicraft /app/bin/anicraft
      - install -Dm755 target/release/anicraft-cli /app/bin/anicraft-cli
      - install -Dm644 -t /app/share/doc/anicraft NOTICE ATTRIBUTION.md LICENSE-MIT LICENSE-APACHE
      - install -Dm644 packaging/linux/ai.storyteller.anicraft.desktop /app/share/applications/ai.storyteller.anicraft.desktop
      - install -Dm644 packaging/linux/ai.storyteller.anicraft.mime.xml /app/share/mime/packages/ai.storyteller.anicraft.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/ai.storyteller.anicraft.metainfo.xml.in > /app/share/metainfo/ai.storyteller.anicraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - shots
          - build-flatpak
          - .flatpak-builder
          - .worktrees
      - cargo-sources.json
