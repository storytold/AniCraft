[package]
name = "anicraft-doc"
description = "AniCraft L1: document model (stage, timeline, layers, keyframes, symbols) and timeline evaluation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anicraft-geom.workspace = true
serde = { workspace = true, features = ["rc"] }
# The maop_maohou sidecar keeps the raw source document JSON (Moho imports).
serde_json.workspace = true
# Bitmaps are kept as PNG and decoded on first use.
png.workspace = true
# Imported JPEGs are decoded and kept as PNG.
zune-jpeg.workspace = true
anicraft-audio.workspace = true
# The timeline action IR keyframes and button instances carry (ADR 0024).
anicraft-actions.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
