[package]
name = "anicraft-engine"
description = "AniCraft L3: session, undo history, command registry and the .anicraft file format"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anicraft-geom.workspace = true
anicraft-doc.workspace = true
anicraft-render.workspace = true
anicraft-xfl.workspace = true
anicraft-svg.workspace = true
anicraft-text.workspace = true
anicraft-plugins.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon.workspace = true
web-time.workspace = true
gif.workspace = true
# Animated PNG frames (ADR 0063; already in the tree through the renderer).
png.workspace = true
image-webp.workspace = true
regex.workspace = true

[dev-dependencies]
# Packs the XFL corpus into .fla archives in tests (ADR 0054; already in the tree through xfl).
miniz_oxide = "0.8"
# Plug-in test fixtures written in WebAssembly text (Apache-2.0 WITH LLVM-exception).
wat = "1.228"

# Runs tests/wasm.rs inside WebAssembly, in Node (ADR 0036; MIT OR Apache-2.0).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
