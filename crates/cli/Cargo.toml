[package]
name = "anicraft-cli"
description = "AniCraft L4: headless CLI, MCP server and the desktop app's live control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "anicraft-cli"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anicraft-doc.workspace = true
anicraft-engine.workspace = true
anicraft-render.workspace = true
anicraft-geom.workspace = true
anicraft-guide.workspace = true
serde_json.workspace = true
# The live control port's per-run token (ADR 0070): the operating system's random numbers.
# MIT OR Apache-2.0, already in the tree.
getrandom = "0.3"

[lints]
workspace = true
