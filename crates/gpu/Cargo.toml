[package]
name = "anicraft-gpu"
description = "AniCraft L3: wgpu stage renderer (tile-binned analytic coverage), checked against the CPU oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anicraft-geom.workspace = true
anicraft-doc.workspace = true
anicraft-render.workspace = true
# The same wgpu the shell's egui-wgpu already builds (one wgpu in the tree, ADR 0019).
wgpu.workspace = true
# Blocks on wgpu's adapter/device futures (already in the tree through eframe).
pollster.workspace = true
# Plain-old-data views of the upload buffers (already in the tree through wgpu and egui).
bytemuck.workspace = true
rayon.workspace = true
web-time.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The shaders' types, to keep them free of what a backend leaves undefined (wgpu's own naga).
naga.workspace = true

[lints]
workspace = true
