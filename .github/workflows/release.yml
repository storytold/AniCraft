# Builds every installer from packaging/ (docs/release.md, ADR 0026) through the Craft family's
# shared release workflow: Windows MSI and portable zip (x64, arm64), macOS universal DMG and CLI
# zip, Linux AppImage, deb, rpm, tar.gz, Flatpak and Arch packages (x86_64, aarch64; riscv64
# without the AppImage), FreeBSD archives, then one draft GitHub Release with SHA256SUMS.txt.
# A push to `release` builds signed artifacts (missing signing secrets fail the run); a manual run
# from any branch builds them unsigned, to try the packaging. Nothing is published: a maintainer
# publishes the draft, which creates the v<version> tag.
name: Release

on:
  # A nightly dry run on main: every release build except macOS, nothing signed or released
  # (craft-common-actions release.yml `dry-run`). Finds release-only breakage before release day.
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write
  # The Flatpak job pushes its OCI image to GHCR.
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      dry-run: ${{ github.event_name == 'schedule' }}
      app-name: anicraft
      app-title: AniCraft
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      # No WebAssembly build of the editor yet (roadmap M8).
      has-web: false
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
      LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
