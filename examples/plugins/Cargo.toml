# Sample AniCraft plug-ins (docs/plugins.md). Not part of the AniCraft workspace: they build for
# wasm32-unknown-unknown only. Build with ./build.sh.
[workspace]
resolver = "3"
members = ["sdk", "star-field", "jitter", "text-export", "stepped-ease"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anicraft-plugin-sdk = { path = "sdk" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# A panic traps (`unreachable`); the host reports it and undoes the run.
panic = "abort"
strip = true
